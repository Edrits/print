<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<div class="tp-pad tp-stack">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)">
    <div class="tp-drop"><div class="tp-drop-icon"><svg class="tp-icon" viewBox="0 0 16 16"><path d="M8 10.5V2M4.5 5.5L8 2l3.5 3.5M2.5 10.5v3h11v-3"/></svg></div><p class="tp-drop-title">Drop files to print</p><p class="tp-drop-hint">or <span class="tp-link">choose files</span> · paste text with ⌘V</p><div class="tp-drop-types"><span class="tp-tag">pdf</span><span class="tp-tag">md</span><span class="tp-tag">txt</span><span class="tp-tag">jpg</span><span class="tp-tag">png</span></div></div>
    <div class="tp-drop tp-drop--active"><div class="tp-drop-icon"><svg class="tp-icon" viewBox="0 0 16 16"><path d="M8 10.5V2M4.5 5.5L8 2l3.5 3.5M2.5 10.5v3h11v-3"/></svg></div><p class="tp-drop-title">Release to add 3 files</p><p class="tp-drop-hint">They'll join the end of the queue</p></div>
  </div>
  <div class="tp-drop tp-drop--compact"><div class="tp-drop-icon"><svg class="tp-icon" viewBox="0 0 16 16"><path d="M8 10.5V2M4.5 5.5L8 2l3.5 3.5M2.5 10.5v3h11v-3"/></svg></div><div><p class="tp-drop-title">Add more files</p><p class="tp-drop-hint">Drop anywhere, or <span class="tp-link">browse</span></p></div></div>
</div>
</body></html>

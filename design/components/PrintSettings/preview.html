<!-- @dsCard group="Settings" height=400 -->
<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<div class="tp-pad" style="max-width:320px"><div class="tp-stack">
<div class="tp-field"><div class="tp-field-label">Paper</div><select class="tp-select"><option>A4 · 210 × 297 mm</option><option>US Letter</option><option>Continuous (fanfold)</option></select></div>
<div class="tp-field"><div class="tp-field-label">Density <span class="tp-mono">5 / 8</span></div><div class="tp-density"><button class="tp-on">1</button><button class="tp-on">2</button><button class="tp-on">3</button><button class="tp-on">4</button><button aria-pressed="true">5</button><button>6</button><button>7</button><button>8</button></div><div class="tp-scale"><span>Lighter</span><span>Darker</span></div></div>
<div class="tp-field"><div class="tp-field-label">Dithering <span class="tp-mono">auto</span></div><div class="tp-seg" style="display:flex"><button aria-pressed="true">Auto</button><button aria-pressed="false">Sharp</button><button aria-pressed="false">Photo</button><button aria-pressed="false">Ordered</button></div><span class="tp-muted" style="font-size:12px;line-height:16px">Auto: hybrid for PDFs, threshold for text, Atkinson for photos.</span></div>
<div class="tp-field"><div class="tp-field-label">Copies</div><div class="tp-row" style="justify-content:space-between"><div class="tp-stepper"><button aria-label="Fewer">−</button><span>1</span><button aria-label="More">+</button></div><div class="tp-seg"><button aria-pressed="true">Fit page</button><button aria-pressed="false">Fill width</button></div></div></div>
</div></div></body></html>
